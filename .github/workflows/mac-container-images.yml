name: Mac ARM64 container images

on:
  push:
    branches:
      - feature/gadi-container-index-variants
    paths:
      - .github/workflows/mac-container-images.yml
      - docs/developer/gadi_singularity/petsc.rhel
      - docs/developer/gadi_singularity/underworld3.rhel
      - container/Dockerfile.mac
      - petsc-custom/patches/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      PETSC_VERSION: "3.25.4"
      UW_VARIANT: int32

    steps:
      - name: Verify native ARM64 builder
        run: test "$(uname -m)" = aarch64

      - name: Check out selected UW3 source
        uses: actions/checkout@v4

      - name: Select image names and index width
        shell: bash
        run: |
          case "$UW_VARIANT" in
            int32)
              uw_int64=0
              uw_expected_bits=32
              ;;
            int64)
              uw_int64=1
              uw_expected_bits=64
              ;;
            *)
              echo "Unsupported variant: $UW_VARIANT" >&2
              exit 1
              ;;
          esac

          uw_tag="petsc${PETSC_VERSION}-${UW_VARIANT}-arm64-${GITHUB_SHA}"
          echo "UW_PETSC_INT64=$uw_int64" >> "$GITHUB_ENV"
          echo "UW_EXPECTED_BITS=$uw_expected_bits" >> "$GITHUB_ENV"
          echo "UW_PETSC_IMAGE=ghcr.io/gthyagi/uw3-petsc:$uw_tag" >> "$GITHUB_ENV"
          echo "UW_RUNTIME_IMAGE=ghcr.io/gthyagi/underworld3-mac:$uw_tag" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PETSc dependency image
        shell: bash
        run: |
          docker build --platform linux/arm64 \
            -f docs/developer/gadi_singularity/petsc.rhel \
            --build-arg PETSC_VERSION="$PETSC_VERSION" \
            --build-arg PETSC_INT64="$UW_PETSC_INT64" \
            --label org.opencontainers.image.source=https://github.com/gthyagi/underworld3 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$UW_PETSC_IMAGE" .

      - name: Publish PETSc dependency image
        run: docker push "$UW_PETSC_IMAGE"

      - name: Build UW3 image
        shell: bash
        run: |
          docker build --platform linux/arm64 \
            -f docs/developer/gadi_singularity/underworld3.rhel \
            --build-arg PETSC_IMAGE="$UW_PETSC_IMAGE" \
            --label org.opencontainers.image.source=https://github.com/gthyagi/underworld3 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t uw3-mac-base:build .

          docker build --platform linux/arm64 \
            -f container/Dockerfile.mac \
            --build-arg UW_IMAGE=uw3-mac-base:build \
            --label org.opencontainers.image.source=https://github.com/gthyagi/underworld3 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$UW_RUNTIME_IMAGE" .

      - name: Check finished image
        shell: bash
        run: |
          docker run --rm \
            --env UW_EXPECTED_BITS="$UW_EXPECTED_BITS" \
            "$UW_RUNTIME_IMAGE" \
            python3 -c '
          import os
          import platform
          import Cython
          import gmsh
          import pygmsh
          import vtk
          import pyvista
          import numpy as np
          import h5py
          import underworld3 as uw
          from petsc4py import PETSc

          assert platform.machine() == "aarch64", platform.machine()
          assert Cython.__version__ == "3.2.3", Cython.__version__
          gmsh.initialize()
          gmsh.model.occ.addSphere(0, 0, 0, 1)
          gmsh.model.occ.synchronize()
          gmsh.model.mesh.generate(3)
          assert len(gmsh.model.mesh.getNodes()[0]) > 0
          gmsh.finalize()
          numpy_version = np.lib.NumpyVersion(np.__version__)
          assert np.lib.NumpyVersion("2.0.0") <= numpy_version < np.lib.NumpyVersion("2.5.0"), np.__version__
          bits = np.dtype(PETSc.IntType).itemsize * 8
          assert bits == int(os.environ["UW_EXPECTED_BITS"]), bits
          assert PETSc.Sys.getVersion() == (3, 25, 4)
          assert h5py.get_config().mpi
          print("Architecture:", platform.machine())
          print("Cython:", Cython.__version__)
          print("Gmsh:", gmsh.__version__)
          print("VTK:", vtk.vtkVersion.GetVTKVersion())
          print("PETSc:", PETSc.Sys.getVersion())
          print("Index bits:", bits)
          print("NumPy:", np.__version__)
          print("UW3:", uw.__file__)
          print("Parallel HDF5:", h5py.get_config().mpi)
          '

          test "$(docker image inspect --format '{{.Architecture}}' "$UW_RUNTIME_IMAGE")" = arm64
          docker run --rm "$UW_RUNTIME_IMAGE" \
            bash -c 'set -e; for tool in gcc g++ gfortran make cmake mpicc; do command -v "$tool"; done'

      - name: Publish checked UW3 image
        run: docker push "$UW_RUNTIME_IMAGE"
